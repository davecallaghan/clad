<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px;
    height: 2400px;
    background: #f5f7fa;
    color: #2a3547;
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 200px 160px;
  }
  .frame {
    flex: 1;
    border: 3px solid #9aa6b8;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 150px 120px;
    box-sizing: border-box;
  }
  .top { }
  .kicker {
    font-size: 40px;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: #7f8ca6;
    margin-bottom: 60px;
  }
  .title {
    font-size: 172px;
    line-height: 1.04;
    font-weight: bold;
    margin: 0;
  }
  .rule {
    width: 220px;
    height: 6px;
    background: #9aa6b8;
    margin: 70px 0;
  }
  .subtitle {
    font-size: 74px;
    line-height: 1.2;
    color: #3a4757;
    font-style: italic;
    margin: 0;
  }
  .bottom { }
  .tagline {
    font-size: 52px;
    color: #6a778c;
    margin-bottom: 40px;
  }
  .author {
    font-size: 64px;
    color: #2a3547;
  }
  .imprint {
    font-size: 40px;
    color: #8a94a6;
    margin-top: 20px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="kicker">A Governance Framework</div>
      <h1 class="title">Trust&nbsp;by Design</h1>
      <div class="rule"></div>
      <p class="subtitle">Governing Enterprise AI with Clad</p>
    </div>
    <div class="bottom">
      <div class="tagline">Hard boundaries. Formal proof.</div>
      <div class="author">David Callaghan</div>
      <div class="imprint">2CData</div>
    </div>
  </div>
</body>
</html>
