# The Scala application: compile, test, and fail on any cancelled test.
#
# A cancelled test is not a passing test. ScalaTest's `assume` cancels, and sbt
# prints "All tests passed" alongside "canceled 2" — which is how the differential
# test against the Lean model stayed inert from April to September 2026.
name: app

on:
  push:
    paths:
      - "app/**"
      - "lean/**"
      - ".github/workflows/app.yml"
      - "tools/ci/assert-no-cancelled-tests.sh"
  pull_request:
    paths:
      - "app/**"
      - "lean/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: sbt

      # The differential tests cancel without this binary, and a cancelled test is
      # now a failed build. lean-action restores the mathlib cache; a cold build of
      # mathlib from source would take hours.
      - name: Build the Lean differential-test executable
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: clad-difftest
          use-mathlib-cache: true

      - name: Compile and test
        working-directory: app
        env:
          LEAN_DIFFTEST_EXE: ${{ github.workspace }}/lean/.lake/build/bin/clad-difftest
        run: sbt -batch test 2>&1 | tee ../sbt-test.log

      - name: Assert no cancelled tests
        run: bash tools/ci/assert-no-cancelled-tests.sh sbt-test.log

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbt-test-log
          path: sbt-test.log
