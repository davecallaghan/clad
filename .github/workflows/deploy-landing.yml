# Deploy landing/ to the GCS static-website bucket.
#
# Manual-trigger only, so it never runs unexpectedly. It is INERT until you
# provide auth. To enable:
#   1. Set up Workload Identity Federation (keyless, recommended):
#        https://github.com/google-github-actions/auth#preferred-direct-workload-identity-federation
#   2. Add these repository variables (Settings > Secrets and variables > Actions > Variables):
#        GCP_PROJECT_ID, GCS_BUCKET_NAME, GCP_REGION,
#        GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#   3. Uncomment the auth + setup + deploy steps below.
name: Deploy landing page

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # - id: auth
